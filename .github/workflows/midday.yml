name: Mid-Day Refresh (Macro + Regime)

# Runs mid-day every weekday. Target ~11 AM ET; with GitHub Actions queue lag
# the run lands closer to midday ET.
#
# Skips fetch_history.py (that's nightly only). Re-runs macro + signal stack.
#
# ---------------------------------------------------------------------------
# CONFLICT-PROOF PUSH (the fix for "update rejected" + "unmerged files" in
# data/worldbank_countries.json and data/macro_trade.json):
#
# These data files are MACHINE-GENERATED — every run rewrites the whole file.
# When two workflows (midday + macro-trade, or a nightly that overlaps) push
# around the same time, a plain `git push` is rejected because the local branch
# is behind origin. The old retry did `git pull --rebase`, but rebasing two
# full-file rewrites of the SAME generated JSON ALWAYS conflicts (both sides
# replaced the entire file), so the rebase halts with "unmerged files" and the
# loop retries against a broken state forever.
#
# The correct pattern for generated artifacts is "latest run wins": don't merge
# histories at all. Stash our outputs, hard-reset onto the freshest origin/main,
# restore our outputs over whatever's there, commit, and push. Retried in a loop
# so even if another job lands in between, the next iteration re-bases onto the
# new tip and overwrites cleanly. No merge, no rebase, no conflict is possible.
# ---------------------------------------------------------------------------

on:
  schedule:
    # z148: twice a weekday - 0807 ET (before the open, so the bot's first passes see fresh macro, signals
    # and regime) and 1132 ET. Was 1130 EDT only, which slid to 1030 in winter.
    - cron: '7 12 * * 1-5'     # 0807 EDT
    - cron: '7 13 * * 1-5'     # 0807 EST
    - cron: '32 15 * * 1-5'    # 1132 EDT
    - cron: '32 16 * * 1-5'    # 1132 EST
  workflow_dispatch:

# Serialize every job in this repo that writes regime/macro data so two of them
# can't race to push at the same instant. (Shared with nightly + macro-trade.)
concurrency:
  group: trapp2-1-data-push
  cancel-in-progress: false

jobs:
  gate:
    # z147: GitHub cron runs on UTC. Each Eastern time is listed for EDT (UTC-4) and EST (UTC-5);
    # this job keeps only the run that lands on the intended ET time (the other one skips in seconds).
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        name: Eastern-time gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          S="${{ github.event.schedule }}"
          OFF=$(TZ=America/New_York date +%z); OFFH=$((10#${OFF:1:2}))
          UM=$(echo "$S" | awk '{print $1}'); UH=$(echo "$S" | awk '{print $2}')
          ETH=$(( (10#$UH - OFFH + 24) % 24 )); ETM=$(printf '%02d' "$UM")
          case " 8:07 11:32 " in *" ${ETH}:${ETM} "*) RUN=true ;; *) RUN=false ;; esac
          echo "schedule '$S' = ${ETH}:${ETM} ET today (UTC${OFF}) -> run=${RUN}"
          echo "run=${RUN}" >> "$GITHUB_OUTPUT"

  refresh:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so fetch/reset works cleanly

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install requirements (only what midday uses — no etf-scraper)
        run: pip install requests pandas fredapi "yfinance>=0.2.50,<0.3"

      - name: Fetch FRED macro series
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FED_API_KEY: ${{ secrets.FED_API_KEY }}
        run: python pipeline/fetch_macro.py

      # z148: the World Bank step is gone from this book - pipeline/fetch_worldbank.py lives only in TRAPP2-1
      # (which refreshes it in its own Mid-Day and Macro Trade runs); here it failed on every run.

      - name: Compute signals
        run: python pipeline/compute_signals.py

      - name: Classify regime + append snapshot
        run: python pipeline/classify_regime.py

      - name: Compute Markov transitions
        run: python pipeline/compute_transitions.py

      # z93: is the regime call trustworthy enough to trade on? (margin, stability,
      # quad agreement, cross-check, 21-session track record). The bot goes
      # regime-agnostic whenever this says it isn't.
      - name: Regime certainty
        run: python pipeline/regime_certainty.py

      - name: Commit & push (midday scope only)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # SCOPED to this job's outputs. The old step staged ALL of data/ and, if
          # a merge failed, copied this run's whole data/ tree over origin -
          # reverting every other workflow's files (tape, fx, leadership, ...).
          OWN="data/macro/ data/worldbank_countries.json data/signals.json data/regime_current.json data/regime_history.json data/regime_certainty.json"
          for p in $OWN; do git add -A "$p" 2>/dev/null || true; done
          if git diff --staged --quiet; then echo "No changes."; exit 0; fi
          echo "=== files staged ==="; git diff --staged --name-only
          git commit -m "Mid-day regime refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git stash push --include-untracked -q -m leftovers 2>/dev/null || true
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then echo "Pushed on attempt $i"; exit 0; fi
            echo "Push rejected - merging remote (ours wins for OUR files) and retrying"
            git fetch origin main
            git merge -X ours origin/main --no-edit 2>/dev/null || true
            if [ -f .git/MERGE_HEAD ]; then
              for p in $OWN; do git checkout --ours -- "$p" 2>/dev/null || true; git add -A "$p" 2>/dev/null || true; done
              git commit --no-edit 2>/dev/null || true
            fi
            sleep $((i * 3))
          done
          echo "ERROR: could not push after 5 attempts."; exit 1
